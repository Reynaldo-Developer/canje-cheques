<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Admin - Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h4 class="fw-bold mb-0" th:text="${mode == 'create' ? 'Nuevo usuario' : 'Editar usuario'}"></h4>
      <div class="text-muted">Campos mínimos + roles</div>
    </div>
    <a class="btn btn-secondary" href="/admin/usuarios">Volver</a>
  </div>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <form th:action="${mode == 'create'} ? @{/admin/usuarios/nuevo} : @{'/admin/usuarios/' + ${form.id} + '/editar'}"
        method="post" class="card p-3 bg-white">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Username</label>
        <input class="form-control" name="username" th:value="${form.username}" required maxlength="50"/>
      </div>

      <div class="col-md-6">
        <label class="form-label">Nombre completo</label>
        <input class="form-control" name="fullName" th:value="${form.fullName}" required maxlength="120"/>
      </div>

      <div class="col-md-2">
        <label class="form-label">Activo</label>
        <select class="form-select" name="enabled">
          <option value="true" th:selected="${form.enabled}">Sí</option>
          <option value="false" th:selected="${form.enabled == false}">No</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">
          Password
          <span class="text-muted" th:if="${mode=='edit'}">(dejar vacío para no cambiar)</span>
        </label>
        <input class="form-control" type="password" name="password" autocomplete="new-password"/>
      </div>

      <div class="col-md-6">
        <label class="form-label">Roles</label>
        <div class="border rounded p-2">
          <div class="form-check" th:each="r : ${roles}">
            <input class="form-check-input"
                    type="checkbox"
                    name="roleIds"
                    th:value="${r.id}"
                    th:checked="${form.roleIds != null and form.roleIds.contains(r.id)}"
                    th:id="'role__' + ${r.id}"/>

            <label class="form-check-label"
                    th:for="'role__' + ${r.id}"
                    th:text="${r.name}"></label>
            </div>
          <div class="text-muted small mt-2">Selecciona al menos 1 rol.</div>
        </div>
      </div>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary" type="submit" th:text="${mode=='create' ? 'Crear' : 'Guardar cambios'}"></button>
      <a class="btn btn-outline-secondary" href="/admin/usuarios">Cancelar</a>
    </div>

  </form>
</div>
</body>
</html>
