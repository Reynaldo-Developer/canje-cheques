<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Editar Sucursal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h3>Editar Sucursal</h3>

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" th:action="@{'/admin/sucursales/' + ${sucursal.id} + '/edit'}" th:object="${sucursal}" class="row g-2">
        <div class="col-md-2">
          <input class="form-control" th:value="${sucursal.id}" readonly>
        </div>
        <div class="col-md-2">
          <input class="form-control" type="number" th:field="*{bancoId}" required>
        </div>
        <div class="col-md-2">
          <input class="form-control" type="number" th:field="*{sucursalId}" required>
        </div>
        <div class="col-md-3">
          <input class="form-control" th:field="*{nombre}" required>
        </div>
        <div class="col-md-1">
          <input class="form-control" th:field="*{ubigeo}" required>
        </div>
        <div class="col-md-2">
          <select class="form-select" th:field="*{exclusiva}">
            <option th:value="false">N</option>
            <option th:value="true">S</option>
          </select>
        </div>
        <div class="col-12">
          <input class="form-control" th:field="*{direccion}" required>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Actualizar</button>
          <a class="btn btn-link" href="/admin/sucursales">Volver</a>
        </div>
      </form>
    </div>
  </div>

</div>
</body>
</html>
