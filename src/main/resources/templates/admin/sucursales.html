<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Sucursales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Mantenimiento de Sucursales</h3>
    <a class="btn btn-outline-secondary" href="/home">Volver</a>
  </div>

  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <form method="post" th:action="@{/admin/sucursales}" th:object="${form}" class="row g-2">
        <div class="col-md-2">
          <input class="form-control" placeholder="BancoId" type="number" th:field="*{bancoId}" required>
        </div>
        <div class="col-md-2">
          <input class="form-control" placeholder="SucursalId" type="number" th:field="*{sucursalId}" required>
        </div>
        <div class="col-md-3">
          <input class="form-control" placeholder="Nombre" th:field="*{nombre}" required>
        </div>
        <div class="col-md-1">
          <input class="form-control" placeholder="Ubigeo" th:field="*{ubigeo}" required>
        </div>
        <div class="col-md-3">
          <input class="form-control" placeholder="Dirección" th:field="*{direccion}" required>
        </div>
        <div class="col-md-1">
          <select class="form-select" th:field="*{exclusiva}">
            <option th:value="false">N</option>
            <option th:value="true">S</option>
          </select>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-striped table-sm align-middle">
        <thead>
        <tr>
          <th>ID(DB)</th>
          <th>BancoId</th>
          <th>SucursalId</th>
          <th>Nombre</th>
          <th>Ubigeo</th>
          <th>Dirección</th>
          <th>Exclusiva</th>
          <th style="width: 200px;">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${sucursales}">
          <td th:text="${s.id}"></td>
          <td th:text="${s.bancoId}"></td>
          <td th:text="${s.sucursalId}"></td>
          <td th:text="${s.nombre}"></td>
          <td th:text="${s.ubigeo}"></td>
          <td th:text="${s.direccion}"></td>
          <td th:text="${s.exclusiva} ? 'S' : 'N'"></td>
          <td>
            <a class="btn btn-sm btn-outline-primary" th:href="@{'/admin/sucursales/' + ${s.id} + '/edit'}">Editar</a>
            <form method="post" th:action="@{'/admin/sucursales/' + ${s.id} + '/delete'}" style="display:inline">
              <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
