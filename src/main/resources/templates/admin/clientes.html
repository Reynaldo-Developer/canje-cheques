<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Mantenimiento de Clientes</h3>
    <a class="btn btn-outline-secondary" href="/home">Volver</a>
  </div>

  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <form method="post" th:action="@{/admin/clientes}" th:object="${form}" class="row g-2">
        <div class="col-md-2">
          <input class="form-control" placeholder="ClienteId" type="number" th:field="*{clienteId}" required>
        </div>
        <div class="col-md-2">
          <input class="form-control" placeholder="Nombre" th:field="*{nombre}" required>
        </div>
        <div class="col-md-2">
          <input class="form-control" placeholder="Apellido" th:field="*{apellido}" required>
        </div>
        <div class="col-md-3">
          <input class="form-control" placeholder="Correo" th:field="*{correo}" required>
        </div>
        <div class="col-md-1">
          <input class="form-control" placeholder="Estado" type="number" th:field="*{estado}">
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-striped table-sm align-middle">
        <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Correo</th>
          <th>Estado</th>
          <th style="width: 200px;">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
          <td th:text="${c.clienteId}"></td>
          <td th:text="${c.nombre}"></td>
          <td th:text="${c.apellido}"></td>
          <td th:text="${c.correo}"></td>
          <td th:text="${c.estado}"></td>
          <td>
            <a class="btn btn-sm btn-outline-primary" th:href="@{'/admin/clientes/' + ${c.clienteId} + '/edit'}">Editar</a>
            <form method="post" th:action="@{'/admin/clientes/' + ${c.clienteId} + '/delete'}" style="display:inline">
              <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
