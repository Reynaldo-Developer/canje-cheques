<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Admin - Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h4 class="fw-bold mb-0">ADMIN - Usuarios</h4>
      <div class="text-muted">Gestión de usuarios y roles</div>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" href="/admin/usuarios/nuevo">Nuevo usuario</a>
      <a class="btn btn-secondary" href="/home">Volver</a>
    </div>
  </div>

  <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

  <table class="table table-striped table-bordered bg-white">
    <thead class="table-dark">
    <tr>
      <th style="width:80px;">ID</th>
      <th>Username</th>
      <th>Nombre</th>
      <th>Roles</th>
      <th style="width:110px;">Estado</th>
      <th style="width:220px;">Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${usuarios}">
      <td th:text="${u.id}"></td>
      <td th:text="${u.username}"></td>
      <td th:text="${u.fullName}"></td>
      <td>
        <span th:if="${#lists.isEmpty(u.roleNames)}" class="text-muted">—</span>
        <span th:each="r : ${u.roleNames}" class="badge text-bg-secondary me-1" th:text="${r}"></span>
      </td>
      <td>
        <span th:if="${u.enabled}" class="badge text-bg-success">Activo</span>
        <span th:unless="${u.enabled}" class="badge text-bg-danger">Inactivo</span>
      </td>
      <td class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-primary" th:href="@{'/admin/usuarios/' + ${u.id} + '/editar'}">Editar</a>

        <form th:action="@{'/admin/usuarios/' + ${u.id} + '/eliminar'}"
            method="post"
            onsubmit="return confirm('¿Eliminar este usuario?');">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

</div>
</body>
</html>
