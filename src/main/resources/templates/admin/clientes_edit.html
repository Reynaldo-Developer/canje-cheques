<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Editar Cliente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h3>Editar Cliente</h3>

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" th:action="@{'/admin/clientes/' + ${cliente.clienteId} + '/edit'}" th:object="${cliente}" class="row g-2">
        <div class="col-md-2">
          <input class="form-control" type="number" th:field="*{clienteId}" readonly>
        </div>
        <div class="col-md-2">
          <input class="form-control" th:field="*{nombre}" required>
        </div>
        <div class="col-md-2">
          <input class="form-control" th:field="*{apellido}" required>
        </div>
        <div class="col-md-4">
          <input class="form-control" th:field="*{correo}" required>
        </div>
        <div class="col-md-2">
          <input class="form-control" type="number" th:field="*{estado}">
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Actualizar</button>
          <a class="btn btn-link" href="/admin/clientes">Volver</a>
        </div>
      </form>
    </div>
  </div>

</div>
</body>
</html>
