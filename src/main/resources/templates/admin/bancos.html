<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Bancos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Mantenimiento de Bancos</h3>
    <a class="btn btn-outline-secondary" href="/home">Volver</a>
  </div>

  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <form method="post" th:action="@{/admin/bancos}" th:object="${form}" class="row g-2">
        <div class="col-md-2">
          <input class="form-control" placeholder="BancoId" type="number" th:field="*{bancoId}" required>
        </div>
        <div class="col-md-6">
          <input class="form-control" placeholder="Nombre" th:field="*{nombre}" required>
        </div>
        <div class="col-md-4">
          <button class="btn btn-primary w-100" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-striped table-sm align-middle">
        <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th style="width: 200px;">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${bancos}">
          <td th:text="${b.bancoId}"></td>
          <td th:text="${b.nombre}"></td>
          <td>
            <a class="btn btn-sm btn-outline-primary" th:href="@{'/admin/bancos/' + ${b.bancoId} + '/edit'}">Editar</a>
            <form method="post" th:action="@{'/admin/bancos/' + ${b.bancoId} + '/delete'}" style="display:inline">
              <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
