<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/home">Canje Cheques</a>
    <form th:action="@{/logout}" method="post" class="d-inline">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <button type="submit" class="btn btn-outline-danger">Cerrar sesión</button>
</form>
  </div>
</nav>

<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="fw-bold mb-1">Bienvenido</h4>
      <div class="text-muted">Acceso: <span sec:authentication="name"></span></div>

      <hr/>

      <a class="btn btn-primary me-2" href="/cheques">Mantenimiento: Cheques</a>

      <div class="mt-3" sec:authorize="hasRole('ADMIN')">
        <div class="alert alert-info mb-2">Panel ADMIN</div>
        <a class="btn btn-outline-dark me-2" href="/admin/usuarios">Usuarios</a>
        <a class="btn btn-outline-dark me-2" href="/admin/bancos">Bancos</a>
        <a class="btn btn-outline-dark me-2" href="/admin/clientes">Clientes</a>
        <a class="btn btn-outline-dark" href="/admin/sucursales">Sucursales</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
