<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Cheques</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/home">Canje Cheques</a>
    <div class="ms-auto">
      <a class="btn btn-outline-light btn-sm" href="/logout">Salir</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">Mantenimiento de Cheques</h4>
    <a class="btn btn-secondary" href="/home">Volver</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
          <tr>
            <th>ID</th><th>Banco</th><th>Sucursal</th><th>Número</th>
            <th>Fecha</th><th>Hora</th><th>Moneda</th><th class="text-end">Monto</th>
            <th>Cliente</th><th>Estado</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="c : ${cheques}">
            <td th:text="${c.chequeId}"></td>
            <td th:text="${c.bancoId}"></td>
            <td th:text="${c.sucursalId}"></td>
            <td th:text="${c.chequeNumero}"></td>
            <td th:text="${c.fecha}"></td>
            <td th:text="${c.hora}"></td>
            <td th:text="${c.moneda}"></td>
            <td class="text-end" th:text="${c.monto}"></td>
            <td th:text="${c.clienteId}"></td>
            <td>
              <span class="badge bg-success" th:if="${c.estado == 1}">Activo</span>
              <span class="badge bg-secondary" th:if="${c.estado != 1}">Inactivo</span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

</body>
</html>
